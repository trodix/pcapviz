name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend (embedded assets)
        working-directory: web
        run: |
          npm ci
          npm run build

      # CGO off => the desktop package compiles its stub, so no native webview
      # libraries are needed just to vet and test the core.
      - name: Vet
        env:
          CGO_ENABLED: "0"
        run: go vet ./...

      - name: Test
        env:
          CGO_ENABLED: "0"
        run: go test ./...

  build:
    name: Build all binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Needed to build the Linux desktop binary (cgo + WebKitGTK 4.1).
      - name: Install native webview deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build binaries
        run: ./.github/build.sh out

      - uses: actions/upload-artifact@v4
        with:
          name: pcapviz-binaries
          path: out/*
          if-no-files-found: error
